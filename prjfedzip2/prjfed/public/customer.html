<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Customer Dashboard</title>
  <link rel="stylesheet" href="../dist/output.css" />
</head>

<body class="bg-gray-100 min-h-screen">

<!-- NAVBAR -->
<nav class="bg-purple-700 text-white px-6 py-4 flex justify-between items-center">
  <h1 class="font-bold text-lg">Customer Portal</h1>
  <a href="#" onclick="logout()" class="text-sm underline">Logout</a>
</nav>

<!-- ✅ WELCOME TEXT (ADDED) -->
<div class="px-6 mt-4">
  <p id="welcomeText" class="text-lg font-semibold text-gray-700"></p>
</div>

<!-- 🔹 CHATBOT (TOP RIGHT BELOW HEADER) -->
<div id="chatbot"
     class="fixed top-28 right-4 w-80 bg-white shadow-lg rounded-lg border z-50">

  <div class="bg-purple-700 text-white p-3 font-semibold rounded-t-lg">
    🤖 Help Bot
  </div>

  <div id="chatMessages"
       class="h-64 overflow-y-auto p-3 text-sm space-y-2">
    <div class="text-gray-600">
      Hi 👋 I’m here to help you!
    </div>
  </div>

  <div class="flex border-t">
    <input
      id="chatInput"
      type="text"
      placeholder="Type your message..."
      class="flex-1 p-2 text-sm outline-none"
    />
    <button
      onclick="sendMessage()"
      class="bg-purple-700 text-white px-4 text-sm">
      Send
    </button>
  </div>
</div>

<!-- MAIN -->
<div class="p-6">

  <!-- CARDS -->
  <div class="grid grid-cols-3 gap-4 mb-6">
    <div class="bg-white p-4 rounded shadow">
      <p class="text-gray-500">Total Amount</p>
      <p id="totalAmount" class="text-2xl font-bold">₹0</p>
    </div>

    <div class="bg-white p-4 rounded shadow">
      <p class="text-gray-500">Status</p>
      <p id="currentStatus" class="text-2xl font-bold">—</p>
    </div>

    <div class="bg-white p-4 rounded shadow">
      <p class="text-gray-500">Approval</p>
      <p id="approvalStatus" class="text-2xl font-bold">—</p>
    </div>
  </div>

  <!-- CASE TABLE -->
  <div class="bg-white p-6 rounded shadow">
    <h2 class="text-xl font-semibold mb-4">My Debt Details</h2>

    <table class="w-full border">
      <thead class="bg-gray-200">
        <tr>
          <th class="p-2">DCA</th>
          <th class="p-2">Amount</th>
          <th class="p-2">Due Date</th>
          <th class="p-2">Status</th>
          <th class="p-2">Approval</th>
          <th class="p-2">Payment Proof</th>
        </tr>
      </thead>
      <tbody id="customerTable"></tbody>
    </table>
  </div>

</div>

<!-- EXISTING SCRIPTS (UNCHANGED) -->
<script src="../src/js/auth.js"></script>
<script src="../src/js/customer.js"></script>

<!-- 🔹 CHATBOT SCRIPT (FRONTEND ONLY) -->
<script>
  function sendMessage() {
    const input = document.getElementById("chatInput");
    const messages = document.getElementById("chatMessages");
    const userText = input.value.trim();

    if (!userText) return;

    messages.innerHTML += `
      <div class="text-right">
        <span class="inline-block bg-purple-100 px-2 py-1 rounded">
          ${userText}
        </span>
      </div>
    `;

    let reply = "I’ll help you with payments, cases, and status 😊";

    if (userText.toLowerCase().includes("payment")) {
      reply = "You can upload your payment proof in the table below.";
    } else if (userText.toLowerCase().includes("status")) {
      reply = "Your case status is shown in the dashboard cards.";
    }

    setTimeout(() => {
      messages.innerHTML += `
        <div class="text-left text-gray-700">
          <span class="inline-block bg-gray-200 px-2 py-1 rounded">
            ${reply}
          </span>
        </div>
      `;
      messages.scrollTop = messages.scrollHeight;
    }, 500);

    input.value = "";
  }
</script>

<!-- ✅ WELCOME SCRIPT (ADDED – AS REQUESTED) -->
<script>
  const userData = JSON.parse(localStorage.getItem("user"));
  if (userData && userData.username) {
    document.getElementById("welcomeText").innerText =
      `Welcome, ${userData.username} 👋`;
  }
</script>

</body>
</html>
